<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Узнайте, сколько стоит ваш бизнес на рынке Алматы: 9 вопросов, 2 минуты, без ввода цифр.">
<meta property="og:title" content="Сколько стоит ваш бизнес?">
<meta property="og:description" content="Игра для владельцев бизнеса в Алматы: цена бизнеса и что её поднимет.">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Сколько стоит ваш бизнес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EF;
  --paper:#FFFFFF;
  --ink:#13211D;
  --muted:#5B6B66;
  --line:#D5DDD9;
  --tag:#F4C21C;
  --tag-ink:#1A1A12;
  --loss:#C8412A;
  --gain:#1F7A55;
  --chip:#E3E9E6;
  --chip-hover:#D6DFDB;
  --shadow:0 1px 0 rgba(19,33,29,.06),0 10px 30px -12px rgba(19,33,29,.25);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1614;--paper:#18221F;--ink:#E7EEEB;--muted:#93A39D;--line:#2B3834;
    --tag:#F4C21C;--tag-ink:#1A1A12;--loss:#F07057;--gain:#5CC897;
    --chip:#22302B;--chip-hover:#2C3C36;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1614;--paper:#18221F;--ink:#E7EEEB;--muted:#93A39D;--line:#2B3834;
  --tag:#F4C21C;--tag-ink:#1A1A12;--loss:#F07057;--gain:#5CC897;
  --chip:#22302B;--chip-hover:#2C3C36;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.brand{font-weight:700;color:var(--ink);letter-spacing:.02em}
.steps{display:flex;gap:4px;flex:1;max-width:220px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--ink)}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:28px 22px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px);font-weight:800}
h2{font-size:clamp(20px,5vw,26px);font-weight:700}
.lead{color:var(--muted);margin:12px 0 0;max-width:46ch}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:12px;padding:16px 20px;font-size:16px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.btn-main{background:var(--ink);color:var(--bg);width:100%}
.btn-tag{background:var(--tag);color:var(--tag-ink);width:100%;display:block;text-align:center;text-decoration:none}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{appearance:none;border:1.5px solid transparent;background:var(--chip);color:var(--ink);font:inherit;font-weight:600;text-align:left;padding:15px 16px;border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.opt:hover{background:var(--chip-hover)}
.opt.picked{border-color:var(--ink)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.react{margin-top:16px;padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--chip)}
.react.good{color:var(--gain)}
.react.bad{color:var(--loss)}
.hero-tag{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.mini-tag{background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-weight:800;padding:8px 14px 8px 22px;border-radius:6px 10px 10px 6px;position:relative;font-size:18px}
.mini-tag::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--paper)}
.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:22px}
.facts b{color:var(--ink)}
/* result */
.tag{background:var(--tag);color:var(--tag-ink);border-radius:14px 22px 22px 14px;padding:26px 22px 24px 46px;position:relative;box-shadow:var(--shadow)}
.tag::before{content:"";position:absolute;left:16px;top:28px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tag .label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.tag .price{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.tag .sub{font-size:14px;margin-top:6px;opacity:.8}
.potential{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--line)}
.potential .p{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,32px);color:var(--gain);font-variant-numeric:tabular-nums}
.gap{font-weight:700;color:var(--loss)}
.losses{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.losses li{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.losses li:last-child{border-bottom:0}
.losses .what{font-weight:600}
.losses .what small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.losses .amt{font-weight:700;color:var(--loss);white-space:nowrap;font-variant-numeric:tabular-nums}
.losses .fix{display:block;font-weight:600;font-size:13.5px;margin-top:6px;color:var(--ink)}
.losses .fix em{font-style:normal;color:var(--muted);font-weight:500;white-space:nowrap}
.losses .amt{color:var(--gain)}
.pack{list-style:none;padding:0;margin:8px 0 20px;display:grid;gap:10px}
.pack li{padding-left:18px;position:relative;font-size:14.5px}
.pack li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:2px;background:var(--tag)}
.btn-sub{display:block;font-size:12.5px;font-weight:600;opacity:.75;margin-top:3px}
.plus-place{margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(26,26,18,.35);font-family:var(--display);font-weight:700;font-size:18px}
.plus-place small{display:block;font-family:var(--body);font-weight:600;font-size:13px;opacity:.75;margin-top:2px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.cta h2{margin-bottom:8px}
.cta ul{margin:12px 0 18px;padding-left:20px;display:grid;gap:6px}
.phone{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.phone b{color:var(--ink);font-size:16px;user-select:all}
.linkbtn{appearance:none;background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
.again{text-align:center}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand">Зауре · бизнес-брокер</span>
    <div class="steps" id="steps" aria-hidden="true"></div>
  </div>
  <main id="app"></main>
</div>

<script>
/* ===== НАСТРОЙКИ (меняйте здесь) ===== */
const CONTACT = { name:"Зауре", phone:"+7 775 998 15 92", wa:"77759981592" };

/* Сколько месяцев прибыли стоит типичный бизнес этой сферы на рынке, без явных проблем */
/* Подготовка к продаже поднимает цену максимум на PACK_MAX (20%) */
const PACK_MAX = 0.20;
const SECTORS = [
  {id:"food",  t:"Общепит",                 m:18},
  {id:"serv",  t:"Услуги",                  m:22, s:"клиника, учебный центр, клининг…"},
  {id:"auto",  t:"Авто",                    m:24, s:"мойка, СТО, шиномонтаж"},
  {id:"trade", t:"Торговля",                m:18, s:"магазин, опт, онлайн"},
  {id:"prod",  t:"Производство",            m:28},
  {id:"other", t:"Другое",                  m:20}
];

/* Вопросы. lost — сколько месяцев прибыли съедает ответ (fix:true — можно вернуть подготовкой) */
const QUESTIONS = [
  {id:"sector", q:"Чем занимается ваш бизнес?", sector:true},
  {id:"profit", q:"Сколько чистой прибыли в месяц остаётся вам?", sub:"Грубо, по ощущениям. Точные цифры не нужны.",
   o:[{t:"до 700 тыс ₸",v:0.5},{t:"700 тыс – 1,2 млн ₸",v:0.9},{t:"1,2–2 млн ₸",v:1.5},{t:"2–4 млн ₸",v:2.8},{t:"4–7 млн ₸",v:5},{t:"больше 7 млн ₸",v:8}],
   react:()=>({c:"good",t:"Записали. Дальше — то, от чего цена растёт или падает."})},
  {id:"age", q:"Сколько лет бизнесу?",
   o:[{t:"меньше года",lost:5,why:"Короткая история",hint:"Покупатель не видит, как бизнес пережил сезоны"},
      {t:"1–3 года",lost:1,why:"Короткая история",hint:"Покупатели доплачивают за проверенные годы"},
      {t:"3–5 лет",lost:0},{t:"больше 5 лет",lost:-2}]},
  {id:"owner", q:"Вы уходите в отпуск на месяц. Бизнес…",
   o:[{t:"работает как обычно",lost:0,r:"good",rt:"Это одна из самых дорогих черт бизнеса."},
      {t:"проседает",lost:2,fix:true,why:"Держится на вас",hint:"Покупатель боится, что без вас выручка упадёт",todo:"Передать ежедневное управление администратору, описать процессы",time:"2–3 месяца"},
      {t:"встанет",lost:4,fix:true,why:"Держится только на вас",hint:"Покупатель покупает не бизнес, а вашу работу",todo:"Найти управляющего, описать процессы, отойти от операционки",time:"3–4 месяца"}]},
  {id:"books", q:"Как вы считаете прибыль?",
   o:[{t:"официальный учёт, всё видно",lost:0,r:"good",rt:"Покупатель поверит цифрам — это деньги."},
      {t:"частично официально, частично «в уме»",lost:2,fix:true,why:"Прибыль не подтверждена",hint:"Что нельзя показать, покупатель не оплачивает",todo:"Свести выручку и расходы в один отчёт, вести его каждый месяц",time:"3 месяца"},
      {t:"записей почти нет",lost:4,fix:true,why:"Прибыль нечем доказать",hint:"Покупатель считает по самой низкой версии",todo:"Начать учёт выручки и расходов, чтобы показать покупателю 6 месяцев цифр",time:"3–6 месяцев"}]},
  {id:"place", q:"Помещение?",
   o:[{t:"своё",lost:0,r:"good",rt:"Отлично: помещение оценим отдельно и добавим к цене бизнеса."},
      {t:"аренда, договор на 3+ года",lost:0},
      {t:"аренда, короткий договор или без договора",lost:3,fix:true,why:"Ненадёжная аренда",hint:"Покупатель рискует потерять точку через год",todo:"Продлить аренду на 3+ года с правом передачи новому владельцу",time:"1–2 недели"}]},
  {id:"clients", q:"Откуда клиенты?",
   o:[{t:"в основном постоянные",lost:0},
      {t:"поровну постоянных и новых",lost:0},
      {t:"в основном случайные",lost:1,fix:true,why:"Нет базы клиентов",hint:"Поток есть, а собранной базы, которую можно передать, нет",todo:"Собрать базу клиентов: телефоны, история покупок, WhatsApp-рассылка",time:"1–2 месяца"}]},
  {id:"staff", q:"Команда?",
   o:[{t:"костяк работает годами",lost:0,r:"good",rt:"Стабильная команда — плюс в торге."},
      {t:"часто меняются",lost:1,fix:true,why:"Текучка",hint:"Покупатель закладывает затраты на найм",todo:"Закрепить ключевых сотрудников: договоры, понятная система оплаты",time:"1 месяц"},
      {t:"всё делаю сам(а)",lost:3,fix:true,why:"Нет команды",hint:"Без вас передавать нечего",todo:"Нанять хотя бы одного человека и передать ему часть работы",time:"2–3 месяца"}]},
  {id:"when", q:"Последний вопрос. Думаете о продаже?",
   o:[{t:"да, в ближайшие полгода",v:"hot"},{t:"возможно, через 1–2 года",v:"warm"},{t:"нет, просто интересно",v:"cold"}]}
];
const BAD_REACTS = ["Здесь теряются деньги.","Минус к цене — но это можно исправить.","Покупатель это заметит."];
/* ===================================== */

const app = document.getElementById("app");
const stepsEl = document.getElementById("steps");
QUESTIONS.forEach(()=>stepsEl.appendChild(document.createElement("i")));
let answers = {}, idx = -1;

function fmt(mln){
  if (mln < 10) return (Math.round(mln*10)/10).toString().replace(".",",") + " млн ₸";
  return Math.round(mln) + " млн ₸";
}
function setSteps(n){ [...stepsEl.children].forEach((el,i)=>el.classList.toggle("on", i<n)); }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function intro(){
  setSteps(0);
  app.innerHTML = `
  <section class="card fade">
    <div class="eyebrow">Игра для владельцев бизнеса · Алматы</div>
    <h1>Сколько стоит ваш бизнес?</h1>
    <p class="lead">9 вопросов, одни кнопки, ни одной цифры вводить не нужно. В конце — цена вашего бизнеса на рынке и сколько миллионов вы сейчас теряете.</p>
    <div class="hero-tag"><span class="mini-tag">? млн ₸</span><span style="color:var(--muted);font-size:14px">≈ 2 минуты · анонимно</span></div>
    <div style="margin-top:26px"><button class="btn btn-main" id="go">Узнать цену</button></div>
  </section>`;
  document.getElementById("go").onclick = ()=>{ idx=0; ask(); };
}

function ask(){
  const Q = QUESTIONS[idx];
  setSteps(idx);
  const opts = Q.sector ? SECTORS.map(s=>({t:s.t,s:s.s,sec:s})) : Q.o;
  app.innerHTML = `
  <section class="card fade">
    <div class="eyebrow">Вопрос ${idx+1} из ${QUESTIONS.length}</div>
    <h2>${esc(Q.q)}</h2>
    ${Q.sub?`<p class="lead" style="font-size:14px">${esc(Q.sub)}</p>`:""}
    <div class="opts">${opts.map((o,i)=>`<button class="opt" id="o${idx}_${i}" data-i="${i}">${esc(o.t)}${o.s?`<small>${esc(o.s)}</small>`:""}</button>`).join("")}</div>
    <div id="react"></div>
  </section>`;
  let locked=false;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(locked) return; locked=true;
    b.classList.add("picked");
    const o = opts[+b.dataset.i];
    answers[Q.id] = o;
    let r=null;
    if (o.r) r={c:o.r,t:o.rt};
    else if (o.lost>0) r={c:"bad",t:BAD_REACTS[idx%BAD_REACTS.length]};
    else if (o.lost<0) r={c:"good",t:"Возраст бизнеса добавляет к цене."};
    else if (Q.react) r=Q.react();
    const rEl=document.getElementById("react");
    if(r){ rEl.innerHTML=`<div class="react ${r.c} fade">${esc(r.t)}</div>`; }
    setTimeout(()=>{ idx++; idx<QUESTIONS.length ? ask() : result(); }, r?1100:350);
  });
}

function compute(){
  const base = answers.sector.sec.m;
  const profit = answers.profit.v;
  let fixLost=0, fixed=0; const losses=[];
  QUESTIONS.forEach(Q=>{
    const o=answers[Q.id]; if(!o || typeof o.lost!=="number") return;
    if(o.fix){ fixLost+=o.lost; losses.push({why:o.why,hint:o.hint,todo:o.todo,time:o.time,m:o.lost}); }
    else fixed+=o.lost;
  });
  const nowM = Math.max(base - fixed - fixLost, 8);
  const potM = Math.min(nowM + fixLost, nowM * (1 + PACK_MAX));
  const scale = (potM - nowM) / (fixLost || 1);
  losses.forEach(l=> l.amt = l.m*scale*profit);
  losses.sort((a,b)=>b.amt-a.amt);
  return { now: profit*nowM, pot: profit*potM, losses, profit };
}

function countUp(el, to){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ el.textContent=fmt(to); return; }
  const t0=performance.now(), d=1200;
  (function f(t){ const k=Math.min((t-t0)/d,1), e=1-Math.pow(1-k,3);
    el.textContent=fmt(to*e); if(k<1) requestAnimationFrame(f); })(t0);
}

function waText(r){
  const a=answers;
  return `Здравствуйте, ${CONTACT.name}! Прошёл(ла) игру «Сколько стоит ваш бизнес».\n`+
    `Сфера: ${a.sector.t}. Прибыль: ${a.profit.t}/мес. Возраст: ${a.age.t}. Помещение: ${a.place.t}.\n`+
    `Оценка сейчас: ~${fmt(r.now)}, после подготовки: до ${fmt(r.pot)}.\n`+
    `Продажа: ${a.when.t}.\nХочу бесплатный разбор бизнеса.`;
}

function result(){
  setSteps(QUESTIONS.length);
  const r = compute();
  const gap = r.pot - r.now;
  const hot = answers.when.v!=="cold";
  const ownPlace = answers.place.t==="своё";
  const waUrl = "https://wa.me/"+CONTACT.wa+"?text="+encodeURIComponent(waText(r));
  app.innerHTML = `
  <div class="fade" style="display:grid;gap:20px">
    <div class="tag">
      <div class="label">${ownPlace ? "Ваш бизнес сейчас, без помещения" : "Ваш бизнес сейчас, как есть"}</div>
      <div class="price" id="pnow">0 млн ₸</div>
      <div class="sub">${esc(answers.sector.t)} · прибыль ${esc(answers.profit.t)} в месяц</div>
      ${ownPlace ? `<div class="plus-place">+ стоимость вашего помещения<small>Оценивается отдельно и добавляется к цене бизнеса</small></div>` : ""}
    </div>

    <section class="card">
      ${gap>0.05 ? `
      <div class="eyebrow">Если подготовить к продаже</div>
      <div class="potential"><span class="p">до ${fmt(r.pot)}</span><span class="gap">вы теряете ${fmt(gap)}</span></div>
      <h2 style="margin-top:22px;font-size:20px">Что поднимет цену</h2>
      <ul class="losses">${r.losses.map(l=>`<li><span class="what">${esc(l.why)}<small>${esc(l.hint)}</small><span class="fix">→ ${esc(l.todo)} <em>${esc(l.time)}</em></span></span><span class="amt">+${fmt(l.amt)}</span></li>`).join("")}</ul>
      ` : `
      <div class="eyebrow">Хорошая новость</div>
      <h2 style="font-size:20px">Ваш бизнес уже упакован</h2>
      <p class="lead">Учёт, команда, аренда — всё, что проверяет покупатель, у вас в порядке. Теперь главное — не уступить в торге и не раскрыть продажу раньше времени.</p>
      `}
      <p class="note">Оценка приблизительная и не окончательная: она построена только на ваших ответах. Точную цену уточним на бесплатном разборе.</p>
    </section>

    <section class="card cta">
      <h2>${hot ? "Как продать и не потерять эти деньги" : "Когда решите продавать"}</h2>
      <div class="eyebrow" style="margin-top:18px">Предпродажная подготовка бизнеса</div>
      <ul class="pack">
        <li><b>Разбор бизнеса</b> — расчёт реальной чистой прибыли, какие документы понадобятся покупателю и что может его насторожить</li>
        <li><b>Оценка</b> — рыночный диапазон цены по прибыли, окупаемости и похожим предложениям; цена предложения и границы торга</li>
        <li><b>Упаковка</b> — анонимный тизер без названия и адреса, инвестиционный меморандум, фото и видео, опись передаваемых активов, тексты объявлений</li>
        <li><b>Продвижение</b> — лендинг бизнеса для покупателей, рекламные креативы (фото, видео, тексты) и настройка таргетированной рекламы</li>
      </ul>
      <a class="btn btn-tag" href="${waUrl}" target="_blank" rel="noopener">Разобрать бизнес бесплатно<span class="btn-sub">Уточним оценку — она приблизительная и не окончательная</span></a>
      <div class="phone"><span>${esc(CONTACT.name)} · бизнес-брокер · <b id="ph">${esc(CONTACT.phone)}</b></span><button class="linkbtn" id="cp">Скопировать номер</button></div>
    </section>

    <div class="again"><button class="linkbtn" id="again">Пройти заново</button></div>
  </div>`;
  countUp(document.getElementById("pnow"), r.now);
  document.getElementById("again").onclick=()=>{ answers={}; intro(); };
  document.getElementById("cp").onclick=async (e)=>{
    try{ await navigator.clipboard.writeText(CONTACT.phone); e.target.textContent="Скопировано"; }
    catch(_){ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("ph")); s.removeAllRanges(); s.addRange(rg); }
  };
  window.scrollTo({top:0,behavior:"smooth"});
}

intro();
</script>

</body>
</html>
